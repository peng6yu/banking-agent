      - "第六条：客户使用手机银行办理对外转账、在线缴费、电子商务业务，须申请开通相应权限后方能办理；手机银行静态密码客户除特殊限额的特约网站消费支付外，不能办理其他对外转账支付类业务（需柜面申领口令卡/电子密码器/U盾）"
      - "第八条：风险提示（官方网站 m.icbc.com.cn、客户端软件下载渠道）"
      - "第九条：交易资格冻结——登录或支付密码当天连续3次验证未通过，临时冻结当日手机银行交易资格、次日自动解除；累计连续10次未通过冻结交易资格，需柜面密码重置或申领新口令卡；冻结期间不影响柜面办理"
    applicable_scenarios: ["transfer", "global"]
