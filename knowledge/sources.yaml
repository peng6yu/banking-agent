      - "分级表述为农行自己的五档客户风险类型（保守/谨慎/稳健/进取/激进）与产品风险等级（低），与《金融机构产品适当性管理办法》的五级划分不是同一套编码。"
    rule_level: "bank_public"
    notes: "本项目理财场景最有价值的一条公开样本：给出了申购/赎回开放时段、预约机制、赎回到账规则、每日赎回笔数上限与风险测评有效期，可据此设计场景状态机。"

