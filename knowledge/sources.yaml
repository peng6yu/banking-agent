    sections:
      - "销售文件构成：本说明书（风险揭示书部分 + 产品说明部分 + 客户权益须知专页）与《中国农业银行股份有限公司理财产品协议》共同构成理财产品销售文件"
      - "风险揭示：认购风险、政策风险、市场风险、流动性风险、信息传递风险、募集失败风险（不能起息时本金于通告募集失败后3个银行工作日内解除冻结）、再投资/提前终止风险、不可抗力风险"
      - "客户所承受的产品风险等级：本产品评级为农行基于投资品种期限、信用等级等要素做出的内部评级结果，仅供参考；产品风险评级「低」（本产品评级为低风险）"
      - "适用投资者：适合风险承受能力为保守型、谨慎型、稳健型、进取型和激进型的投资者，适合无投资经验和有投资经验的投资者"
      - "产品要素：产品名称、投资币种人民币、产品风险评级低、理财期限3653天、产品类型保本浮动收益型、认购起点与递增金额、销售机构为农行及其授权分支机构、销售渠道为授权网点/网上银行/掌上银行/现金管理平台"
      - "申购开放期与开放时段：每个银行工作日为开放期，开放期00:00–17:00（含）为申购开放时段；非开放时段可提出预约申购/预约追加申购；银行工作日00:00–17:00申购当日起息，非开放时段及非银行工作日申请为预约申购、下一银行工作日起息"
      - "赎回开放期与开放时段：每个银行工作日为开放期，开放期08:00–15:00（含）为赎回开放时段；产品到期日不开放赎回；单一账户每日赎回笔数最高30次；非赎回开放时段可提出预约赎回"
      - "赎回到账日与到账时间：银行工作日08:00–15:00赎回→当日实时到账；银行工作日00:00–08:00预约赎回→当日9:00后到账；银行工作日15:00–24:00及非银行工作日预约赎回→下一银行工作日凌晨到账"
      - "客户风险承受能力评估：需填写《个人投资者风险承受能力评估问卷》或《对公客户风险类型评估问卷（非衍生交易类）》；首次填写需到网点柜面；一年内再次购买可不再填写，一年后必须重新填写；发生可能影响风险承受能力的情形应主动要求重新评估；不准确完整填写可能对产品认购带来不利影响"
      - "信息查询与登记编码：登记编码 C1010316001717，客户可在中国理财网（www.china-wealth.cn）查询"
