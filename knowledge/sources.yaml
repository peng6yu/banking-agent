schema_version: "1.0"
last_updated: "2026-10-23"
metadata:
  project: "banking-agent（银行 AI 智能体竞赛项目，阶段 2：领域知识层）"
  scope: "转账 / 理财操作 / 订阅代扣 / 跨场景 四类场景所需的法律法规依据与商业银行公开业务规则"
  verification_method: "逐条实际打开 URL 并读到正文（curl 带浏览器 UA，GB2312/GBK 站点按 gb18030 解码；JS 渲染页面改用官方 JSON 数据接口取正文）"
  rule_level_legend:
    law: "法律法规 / 监管规章的明文要求"
    bank_public: "某一家商业银行在其官方网站公开的业务规则或产品文件（仅代表该行，不具通用性）"
    contest_simulation: "竞赛原型自行设定的模拟规则（不具任何法律效力，也不是任何银行的真实规则）"
  scenario_values: ["transfer", "wealth", "mandate", "cross_scene", "global"]
  caveats:
    - "本文件不声称还原任何银行的内部流程；所有 bank_public 条目均为银行对外公开页面上的文字。"
    - "各行限额差异极大且常因分行、认证方式、渠道、客户等级而不同，任何单一数字都不得当作行业通例。"
    - "竞赛原型中的 1000 元分界线属于 contest_simulation，不是法定限额，也不是任何银行的公开限额。"

sources:
  # ================= 一、法律法规与监管规章（rule_level: law） =================

  - source_id: "LAW-ANTI-FRAUD-2022"
    title: "中华人民共和国反电信网络诈骗法"
    issuer: "全国人民代表大会常务委员会（工业和信息化部产业政策与法规司页面转载全文）"
    published_at: "2022-09-02"        # 2022年9月2日十三届全国人大常委会第三十六次会议通过；工信部页面发布日 2022-09-08
    effective_from: "2022-12-01"      # 第五十条
    source_url: "https://www.miit.gov.cn/jgsj/zfs/fl/art/2022/art_d30139b442a141f48f05775d8c0b3cee.html"
    sections:
      - "第六条：电信业务经营者、银行业金融机构、非银行支付机构、互联网服务提供者承担风险防控责任，建立反电信网络诈骗内部控制机制和安全责任制度，加强新业务涉诈风险安全评估"
      - "第十五条：为客户开立银行账户、支付账户及提供支付结算服务和业务关系存续期间，应建立客户尽职调查制度，依法识别受益所有人，采取风险管理措施"
      - "第十六条：开立账户不得超出国家规定限制数量；异常开户有权加强核查或拒绝开户；开户情况及风险信息不得用于反电信网络诈骗以外其他用途"
      - "第十八条：对银行账户、支付账户及支付结算服务加强监测，建立异常账户和可疑交易监测机制；可采取核实交易情况、重新核验身份、延迟支付结算、限制或中止有关业务等必要防范措施"
      - "第十九条：完整准确传输商户名称、收付款客户名称及账号等交易信息"
      - "第二十九条：个人信息处理者依《个人信息保护法》处理个人信息，应建立个人信息被用于电信网络诈骗的防范机制"
      - "第三十条：在业务活动中作出提示，对新出现的诈骗手段及时提醒，警示非法买卖出租出借银行卡/账户/账号被用于诈骗的法律责任"
      - "第三十二条：采取限制、暂停等处置的，应告知处置原因、救济渠道及需提交资料，被处置对象可申诉"
      - "第四十条：银行未落实内控机制、未履行尽职调查与风险管理、未履行异常账户和可疑交易监测处置义务、未按规定完整准确传输交易信息的罚则（5万–50万元；情节严重50万–500万元并可责令停业整顿、吊销许可证）"
      - "第四十九条：本法未规定的管理和责任制度，适用《网络安全法》《个人信息保护法》《反洗钱法》等"
    applicable_scenarios: ["transfer", "wealth", "mandate", "cross_scene", "global"]
    last_verified_at: "2026-10-23"
    status: "verified"
    limitations:
      - "只核验了工信部转载的全文页面与施行日期，未与全国人大公报版本逐字比对。"
      - "第四十条罚则中「直接责任人员 1万–20万元」的适用由监管裁量决定，本项目不作模拟。"
    rule_level: "law"
    notes: "本项目涉及转账/代扣的异常交易监测、风险提示、可疑行为处置、申诉告知等要求的直接法定依据。"

  - source_id: "LAW-PIPL-2021"
    title: "中华人民共和国个人信息保护法"
    issuer: "全国人民代表大会常务委员会（中国人大网发布全文）"
    published_at: "2021-08-20"        # 十三届全国人大常委会第三十次会议通过，主席令第九十一号
    effective_from: "2021-11-01"
    source_url: "http://www.npc.gov.cn/npc/c2/c30834/202108/t20210820_313088.html"
    sections:
      - "第五条：处理个人信息应遵循合法、正当、必要、诚信原则，不得以误导、欺诈、胁迫方式处理"
      - "第六条：处理应具有明确合理目的、与目的直接相关、采取对个人权益影响最小的方式；收集限于实现目的的最小范围，不得过度收集"
      - "第十三条：七类合法处理基础（同意；订立或履行合同必需；履行法定职责或法定义务必需；突发公共卫生事件或紧急情况；公共利益新闻报道舆论监督合理范围；合理范围内处理自行公开或已合法公开信息；法律行政法规规定的其他情形）"
      - "第十四条：同意须在充分知情下自愿、明确作出；处理目的、方式、种类变更应重新取得同意"
      - "第二十四条：自动化决策应保证透明度与结果公平公正，不得在交易价格等交易条件上实行不合理差别待遇；信息推送与商业营销应提供不针对个人特征的选项或便捷拒绝方式；对个人权益有重大影响的决定，个人有权要求说明并有权拒绝仅通过自动化决策作出决定"
      - "第二十八条：敏感个人信息包括生物识别、宗教信仰、特定身份、医疗健康、金融账户、行踪轨迹及不满十四周岁未成年人信息；须有特定目的、充分必要性并采取严格保护措施"
      - "第二十九条：处理敏感个人信息应取得单独同意"
      - "第三十条：处理敏感个人信息的特别告知义务"
      - "第五十一条：安全措施（内部管理制度与操作规程；分类管理；加密、去标识化等技术措施；确定操作权限并定期教育培训；个人信息安全事件应急预案；其他）"
      - "第五十五条：应事前进行个人信息保护影响评估并记录的五类情形（含处理敏感个人信息、利用个人信息进行自动化决策）"
      - "第五十六条：影响评估内容；报告与记录至少保存三年"
      - "第五十七条：发生或可能发生泄露、篡改、丢失应立即补救并通知监管部门和个人"
    applicable_scenarios: ["transfer", "wealth", "mandate", "cross_scene", "global"]
    last_verified_at: "2026-10-23"
    status: "verified"
    limitations:
      - "以中国人大网发布页为准；该页未提供「最近修订」标记，未逐条与国家法律法规数据库比对。"
    rule_level: "law"
    notes: "金融账户信息属第二十八条列举的敏感个人信息；本项目的自动化决策（是否放行转账/申购）直接落入第二十四条与第五十五条的约束范围。"

  - source_id: "LAW-DSL-2021"
    title: "中华人民共和国数据安全法"
    issuer: "全国人民代表大会常务委员会（中国人大网发布全文）"
    published_at: "2021-06-10"        # 十三届全国人大常委会第二十九次会议通过，主席令第八十四号
    effective_from: "2021-09-01"
    source_url: "http://www.npc.gov.cn/npc/c2/c30834/202106/t20210610_311888.html"
    sections:
      - "第二十一条：国家建立数据分类分级保护制度；国家数据安全工作协调机制统筹制定重要数据目录；国家核心数据实行更严格管理"
      - "第二十二条：国家建立集中统一、高效权威的数据安全风险评估、报告、信息共享、监测预警机制"
      - "第二十三条：国家建立数据安全应急处置机制"
      - "第二十七条：开展数据处理活动应建立健全全流程数据安全管理制度、组织数据安全教育培训、采取技术措施；利用互联网等信息网络开展数据处理活动应履行网络安全等级保护制度下的义务；重要数据的处理者应明确数据安全负责人和管理机构"
      - "第二十九条：开展数据处理活动应当加强风险监测，发现数据安全缺陷、漏洞等风险时立即采取补救措施；发生数据安全事件时立即采取处置措施，按照规定及时告知用户并向有关主管部门报告"
      - "第三十条：违反数据安全保护义务的罚则（责令改正、警告并处5万–50万元罚款；严重后果50万–200万元，可责令暂停业务、停业整顿、吊销许可证；违反国家核心数据管理制度200万–1000万元）"
      - "第三十一条：向境外提供重要数据的罚则"
      - "第五十五条：本法自2021年9月1日起施行"
    applicable_scenarios: ["global", "cross_scene"]
    last_verified_at: "2026-10-23"
    status: "verified"
    limitations:
      - "本次核验在正文全文中定位到第二十九条「风险监测」「事件处置」条款，任务书所列「风险监测、事件处置」对应条号为第二十九条。"
    rule_level: "law"
    notes: "第二十九条是「发现风险→补救→事件处置→告知用户与主管部门」链条的法定来源，可直接支撑跨场景的异常处置与告知话术设计。"

  - source_id: "LAW-AML-2024"
    title: "中华人民共和国反洗钱法（2024年修订，现行有效）"
    issuer: "全国人民代表大会常务委员会（国家金融监督管理总局网站发布全文）"
    published_at: "2024-11-08"        # 十四届全国人大常委会第十二次会议修订通过
    effective_from: "2025-01-01"      # 第六十五条
    source_url: "https://www.nfra.gov.cn/cn/static/data/DocInfo/SelectByDocId/data_docId=1199538.json"
    sections:
      - "第二十九条：应开展客户尽职调查的三类情形（建立业务关系或提供规定金额以上一次性金融服务；有合理理由怀疑客户及交易涉嫌洗钱；对已获客户身份资料真实性、有效性、完整性存疑）；尽调含识别并合理措施核实客户及受益所有人身份、了解交易目的，较高洗钱风险还应了解资金来源与用途"
      - "第三十条：业务关系存续期间持续关注并评估客户与交易；交易与所掌握的身份资料及风险状况不符应进一步核实；对高风险情形必要时可限制交易方式、金额或频次，限制业务类型，拒绝办理业务，终止业务关系；措施须与风险相匹配，不得影响医疗、社保、公用事业等基本必需金融服务"
      - "第三十四条：建立客户身份资料和交易记录保存制度；客户身份资料在业务关系结束后、客户交易信息在交易结束后应当至少保存十年；机构解散、撤销、破产应移交指定机构"
      - "第六十五条：本法自2025年1月1日起施行"
    applicable_scenarios: ["transfer", "wealth", "mandate", "cross_scene", "global"]
    last_verified_at: "2026-10-23"
    status: "verified"
    limitations:
      - "正文经金融监管总局站点的官方 JSON 数据接口取得（页面本身为 JS 渲染），引用时应同时标注 docId=1199538。"
      - "保存期限为「至少十年」，不同于旧法的五年，注意不要沿用旧口径。"
    rule_level: "law"
    notes: "第三十条是本项目「按风险限制交易方式/金额/频次」在转账与代扣场景中的法定依据；注意「措施须与风险相匹配」这一约束，禁止一刀切拒绝。"

  - source_id: "REG-AML-CDD-2025-11"
    title: "金融机构客户尽职调查和客户身份资料及交易记录保存管理办法（现行）"
    issuer: "中国人民银行、国家金融监督管理总局、中国证券监督管理委员会（令〔2025〕第11号）"
    published_at: "2025-10-31"
    effective_from: "2026-01-01"
    source_url: "https://www.pbc.gov.cn/zhengwugongkai/4081330/4406346/4406348/2025122909302246824/index.html"
    sections:
      - "第二条：适用机构范围（政策性银行、商业银行、农村合作银行、农村信用合作社、村镇银行；证券、期货、基金；保险及保险资管；信托、金融资产管理、企业集团财务、金融租赁、汽车金融、消费金融、货币经纪、理财公司；非银行支付机构等）"
      - "第三条：「了解你的客户」，识别核实客户及受益所有人身份并持续关注评估；较高风险强化尽调、较低风险简化尽调"
      - "第四条：按安全、准确、完整、保密原则保存客户身份资料及交易记录，确保足以重现每笔交易"
      - "第四十四条：客户身份资料自业务关系结束或一次性金融服务结束后至少保存十年；交易记录自交易结束后至少保存十年；涉可疑交易调查未结束的保存至调查结束"
      - "第四十六条：罚则援引《反洗钱法》第五十二条至第五十六条"
      - "第四十七条：银行卡清算机构、网络支付清算机构、网络小额贷款公司、汇兑与基金销售与保险专业代理及保险经纪等亦适用"
    applicable_scenarios: ["transfer", "wealth", "mandate", "cross_scene", "global"]
    last_verified_at: "2026-10-23"
    status: "verified"
    limitations:
      - "同时核到司法部镜像页（https://www.moj.gov.cn/pub/sfbgw/flfggz/flfggzbmgz/202512/t20251224_529734.html），两处文本一致。"
    rule_level: "law"
    notes: "「确保足以重现每笔交易」是对本项目交易流水/审计字段设计的直接法定约束。"

  - source_id: "REG-AML-CDD-2022-01"
    title: "金融机构客户尽职调查和客户身份资料及交易记录保存管理办法（2022年版，已被取代）"
    issuer: "中国人民银行、国家金融监督管理总局、中国证券监督管理委员会（2022年第1号令）"
    published_at: ""
    effective_from: ""
    source_url: ""
    sections:
      - "（未逐条核验：本次未打开 2022 年第 1 号令原文页面）"
    applicable_scenarios: ["global"]
    last_verified_at: "2026-10-23"
    status: "superseded"
    limitations:
      - "被 REG-AML-CDD-2025-11（令〔2025〕第11号）取代，取代关系已核验；但旧令原文未打开，公布日与施行日未核，故不填。"
    rule_level: "law"
    notes: "登记为「旧文件不得当作现行依据」的反例：任何引用保存期限、尽职调查流程的旧文档都应回到 2025 年第 11 号令。"

  - source_id: "REG-LARGE-TX-2016-03"
    title: "金融机构大额交易和可疑交易报告管理办法（现行有效，但已被令〔2025〕第10号修改）"
    issuer: "中国人民银行（令〔2016〕第3号）"
    published_at: "2016-12-28"
    effective_from: "2017-07-01"
    source_url: "https://www.pbc.gov.cn/fanxiqianju/135153/135173/3286153/index.html"
    sections:
      - "第五条：大额交易标准——当日单笔或累计现金收支5万元人民币/1万美元以上；非自然人客户账户间划转200万元/20万美元以上；自然人客户境内划转50万元/10万美元以上；自然人客户跨境划转20万元/1万美元以上"
      - "第二十二条：大额交易报告、可疑交易报告及分析记录自生成之日起至少保存五年"
      - "第二十五条：非银行支付机构、从事汇兑业务、基金销售业务等机构的相关适用规则"
    applicable_scenarios: ["transfer", "mandate", "global"]
    last_verified_at: "2026-10-23"
    status: "verified"
    limitations:
      - "第二条、第九条、第十四条已被 REG-PBC-2025-10 修改，本条记录所载文本为修改前原文，仅第五、二十二、二十五条可用。"
      - "大额交易标准是「反洗钱报告触发线」，不是银行对客户设置的转账限额，两者不可混用。"
    rule_level: "law"
    notes: "本项目如要模拟「大额交易监测」，阈值须引用本条（50万元等）并注明是反洗钱报告口径，绝不可当作银行限额或比赛阈值。"

  - source_id: "REG-PBC-2025-10"
    title: "中国人民银行关于修改和废止部分规章的决定（令〔2025〕第10号）"
    issuer: "中国人民银行"
    published_at: "2025-09-30"        # 2025年9月16日经中国人民银行2025年第13次行务会议审议通过
    effective_from: "2025-12-01"
    source_url: "https://www.pbc.gov.cn/zhengwugongkai/4081330/4406346/4406348/2025120610454759840/index.html"
    sections:
      - "修改《金融机构大额交易和可疑交易报告管理办法》（中国人民银行令〔2016〕第3号）第二条：适用机构范围与「从事汇兑业务、基金销售业务、保险专业代理和保险经纪业务的机构以及网络小额贷款公司适用本办法」"
      - "修改第九条：新增一類由银行机构代为提交大额交易报告的机构"
      - "修改第十四条第一款：金融机构应对交易监测标准筛选出的交易进行人工分析、识别并记录分析过程；不作为可疑交易报告的应记录排除的合理理由；确认为可疑交易的应在报告理由中完整记录对客户身份特征、交易特征或行为特征的分析过程；对人工分析、识别、排除或确认工作设置合理时限"
      - "修改第十四条第二款：人工分析过程中必要时通过客户尽职调查进一步了解客户及交易风险状况，确保可疑交易判断与尽调内容相互验证；发现洗钱或恐怖融资风险状况变化的应合理划分、动态调整客户洗钱风险等级"
    applicable_scenarios: ["transfer", "mandate", "global"]
    last_verified_at: "2026-10-23"
    status: "verified"
    limitations:
      - "已在人民银行官网与国务院公报（中国政府网）两个官方渠道核到同一文本，发布时间与施行日期一致。"
    rule_level: "law"
    notes: "「人工分析须记录分析过程与排除理由」是可疑交易类判定的法务依据，也是本项目「说不清就记为未判定、不得强行解释」要求的同源要求。"

  - source_id: "REG-SUITABILITY-2025-07"
    title: "金融机构产品适当性管理办法（国家金融监督管理总局令2025年第7号）"
    issuer: "国家金融监督管理总局（金融消费者权益保护局）"
    published_at: "2025-07-11"
    effective_from: "2026-02-01"
    source_url: "https://www.nfra.gov.cn/cn/view/pages/ItemDetail.html?docId=1217183&generaltype=0&itemId=928"
    sections:
      - "第二条：适当性管理指金融机构根据产品基本属性、风险特征，结合客户金融需求、财务状况、风险承受能力，开展识别、提示、匹配、销售、交易等活动"
      - "第三条：适用于收益具不确定性且可能导致本金损失的投资型产品及保险产品；银行间市场业务另按相关规定；「金融机构」指金融监管总局监管的持牌机构"
      - "第七条：应具备符合适当性管理要求的信息系统，对不符合适当性管理要求的应具备识别、提示、限制交易等功能；保障数据安全"
      - "第九条：清晰界定产品的属性特征、风险水平、权利义务关系和适合的客户范围"
      - "第十条：合理范围收集客户信息、评估客户情况；客户拒绝提供信息的可拒绝销售；履行客户信息保护义务"
      - "第十二条：除第三十八条情形外，不得向客户销售不具备适当性的产品（含产品风险等级高于客户风险承受能力的情形）"
      - "第十三条：禁止主动推介风险等级高于客户承受能力的产品，禁止欺骗误导客户购买不具备适当性的产品"
      - "第十四条：通过互联网等线上方式销售的，应将适当性管理嵌入流程，保障知情权、自主选择权"
      - "第十七条：客观完整记录适当性管理重点环节（产品评级结果、客户评估结果、告知提示资料、录音录像资料），确保可回溯；记录保存期限不低于合同关系终止后五年"
      - "第十八条：向六十五周岁以上客户销售或交易高风险产品应履行特别注意义务（专门程序、追加了解、强化告知提示、更多考虑时间、及时回访），线上流程应兼顾适老性、易用性、安全性"
      - "第二十二条：投资型产品统一划分风险等级，由低到高至少一级至五级；发行机构与销售机构评级不一致时销售机构按孰高原则采用并披露"
      - "第二十九条：投资者风险承受能力评估等级由低到高至少一级至五级；同一机构单日评估不得超过两次、十二个月内累计不得超过八次；评估结果有效期原则上12个月，超期或客户告知情况可能变化时应重新评估"
      - "第三十条：私募产品非公开销售，不得拆分份额变相降低投资门槛，不得向不特定对象宣传推介"
      - "第三十一条：投资型产品销售前应告知风险等级及调整情况等"
      - "第三十六条：投连险等可能损失本金的产品按投资型产品要求做产品风险评级与投保人风险承受能力评估"
      - "第四十九条：自2026年2月1日起施行"
    applicable_scenarios: ["wealth", "cross_scene", "global"]
    last_verified_at: "2026-10-23"
    status: "verified"
    limitations:
      - "正文取自金融监管总局官方 JSON 数据接口（data_docId=1217183.json），页面本身为 JS 渲染。"
      - "「产品风险五级」「客户风险五级」是本办法的最低要求（至少一级至五级），各行自有评级体系（工行 PR1–PR5、农行低/中/高等）可与之不同。"
      - "银行理财产品是否一律落入第三条适用范围的「投资型产品」，需结合产品类型判断，本项目不得对所有理财产品一概而论。"
    rule_level: "law"
    notes: "本项目理财场景的「风险匹配」核心法定依据；第十四条「嵌入线上流程」直接要求 Agent 的适当性动作不能只在文档里写、必须落到交互流程里。"

