schema_version: "1.0"
last_updated: "2026-10-23"
metadata:
  project: "banking-agent（银行 AI 智能体竞赛项目，阶段 3：银行领域知识层）"
  scope: "转账 / 理财 / 代扣 / 卡片 / 跨场景 五类业务涉及的实体与关系"
  purpose: "给 app/knowledge/retrieve.py 做元数据筛选与一致性校验；关系两端必须是本文件已定义的实体 id"
  id_rules:
    - "实体 id 用可读英文小写下划线，与术语 id（TERM-*）、来源 id（大写短横线）区分开。"
    - "每条 relation 的 domain / range 必须指向已定义实体，否则加载期报 KNOW_BAD_RELATION_ENDPOINT。"
    - "kind 是本原型自定的关系类型词表（owns / debits / ...），只用于检索分组，不参与权限裁决。"
  caveats:
    - "本体只描述业务对象之间的结构关系，不描述金额、限额与放行条件——那两块在 intent_rules.yaml 与 app/policy/ 里。"
    - "实体与关系都是数据，不是指令；模型读到本文件也不能据此获得任何操作权限。"

entities:
  # ---- 用户与账户 ----
  - id: "user"
    label: "用户"
    type: "person"
    definition: "发起请求的银行客户本人。身份只来自已验签凭据，不来自聊天对话里的自称。"
    source_ids: ["CONTEST-REQ-2026", "LAW-PIPL-2021"]
  - id: "account"
    label: "银行账户"
    type: "account"
    definition: "客户在银行开立、用于存放资金与记账的账户；同一客户可有多个账户，账户归属唯一。"
    source_ids: ["BANK-ICBC-ACCT-AGREEMENT-2021", "CONTEST-POLICY-RULES-PY"]
  - id: "card"
    label: "银行卡"
    type: "instrument"
    definition: "账户的支付介质，包括实体借记卡、信用卡与虚拟卡；卡片限额与账户转账限额是两套口径。"
    source_ids: ["BANK-ICBC-EB-RULES-2025", "CONTEST-REQ-2026"]

  # ---- 转账链路 ----
  - id: "payee"
    label: "收款人"
    type: "party"
    definition: "转账的目标对象，由姓名加可解析标识唯一确定；别名是它的一个可选标识。"
    source_ids: ["BANK-ICBC-ALIAS-REMIT", "LAW-ANTI-FRAUD-2022"]
  - id: "transfer_order"
    label: "转账指令"
    type: "order"
    definition: "一次转账请求的业务对象，承载金额、收款人、状态与两阶段执行信息。"
    source_ids: ["CONTEST-POLICY-RULES-PY", "BANK-ICBC-MB-RULES"]
  - id: "scheduled_order"
    label: "预约转账指令"
    type: "order"
    definition: "未来某个执行日才真正发起的转账指令；创建期只登记、不扣款。"
    source_ids: ["CONTEST-POLICY-RULES-PY", "CONTEST-REQ-2026"]
  - id: "split_bill_request"
    label: "AA 拆账请求"
    type: "request"
    definition: "把一笔共同消费拆成多笔转账的请求，合计金额不得超过实付金额。"
    source_ids: ["CONTEST-REQ-2026", "CONTEST-POLICY-RULES-PY"]
  - id: "reversal_record"
    label: "冲正记录"
    type: "record"
    definition: "对已记账转账做反向记账的留痕，一笔原交易最多对应一条有效冲正。"
    source_ids: ["CONTEST-POLICY-RULES-PY", "GAP-TRANSFER-RETURN-CN"]

  # ---- 交易与账单 ----
  - id: "transaction"
    label: "交易流水"
    type: "record"
    definition: "账户上实际发生的记账记录，是余额与账单的唯一事实来源。"
    source_ids: ["BANK-ICBC-ACCT-AGREEMENT-2021", "CONTEST-POLICY-RULES-PY"]
  - id: "bill"
    label: "账单"
    type: "document"
    definition: "按期间或类别汇总交易得到的消费明细，用于分析；它是统计口径，不改交易事实。"
    source_ids: ["LAW-PIPL-2021", "BANK-ICBC-ACCT-AGREEMENT-2021"]

  # ---- 理财链路 ----
  - id: "fund_product"
    label: "理财产品"
    type: "product"
    definition: "可申购、赎回的资管产品，带有产品风险等级、开放时段与赎回到账规则。"
    source_ids: ["BANK-ABC-PS-2016", "REG-SUITABILITY-2025-07"]
  - id: "purchase_order"
    label: "申购指令"
    type: "order"
    definition: "客户买入理财产品的业务对象，成交前需通过适当性匹配。"
    source_ids: ["BANK-ABC-PS-2016", "REG-SUITABILITY-2025-07"]
  - id: "redeem_order"
    label: "赎回指令"
    type: "order"
    definition: "客户卖出理财份额的业务对象，资金按赎回到账规则返回账户。"
    source_ids: ["BANK-ABC-PS-2016", "BANK-ABC-EWEALTH-PRODUCT-PAGE"]
  - id: "risk_assessment"
    label: "风险测评"
    type: "record"
    definition: "客户风险承受能力的测评记录，有有效期；过期需重测后才能继续申购。"
    source_ids: ["REG-SUITABILITY-2025-07", "BANK-ABC-PS-2016"]

  # ---- 代扣链路 ----
  - id: "mandate"
    label: "代扣协议"
    type: "agreement"
    definition: "银行按约定从指定账户向商户扣款的授权协议；签约与解约都作用于银行侧。"
    source_ids: ["BANK-ICBC-MANDATE-BIZ", "BANK-ICBC-MANDATE-SIGN", "BANK-ICBC-MANDATE-CANCEL"]
  - id: "subscription_service"
    label: "订阅服务"
    type: "merchant"
    definition: "商户侧的周期性服务，扣费通过代扣协议完成；银行侧解约不会自动取消它。"
    source_ids: ["BANK-ICBC-MANDATE-CANCEL", "BANK-CCB-CHARGE"]

  # ---- 卡片操作 ----
  - id: "card_loss_report"
    label: "挂失记录"
    type: "record"
    definition: "客户申报卡片丢失或被冒用的留痕，挂失不可逆，补卡需另行走柜面流程。"
    source_ids: ["CONTEST-REQ-2026", "BANK-ICBC-EB-RULES-2025"]

  # ---- 主动财务管理 ----
  - id: "savings_goal"
    label: "储蓄目标"
    type: "goal"
    definition: "客户为某个用途设定的目标金额与期限，只用于计划与提醒。"
    source_ids: ["CONTEST-REQ-2026"]
  - id: "budget"
    label: "预算"
    type: "plan"
    definition: "客户为某段时间或某类消费设定的金额上限，只用于提醒与分析。"
    source_ids: ["CONTEST-REQ-2026", "CONTEST-POLICY-RULES-PY"]

  # ---- 风控与留痕 ----
  - id: "limit_policy"
    label: "限额策略"
    type: "policy"
    definition: "对转账或卡片设置的金额与笔数约束，由银行规则与竞赛原型规则共同构成，需分 rule_level 标注。"
    source_ids: ["BANK-ICBC-EB-RULES-2025", "CONTEST-POLICY-RULES-PY"]
  - id: "risk_signal"
    label: "风险信号"
    type: "signal"
    definition: "由规则或模型产出的可疑特征（如新收款人大额、深夜高频），只影响提示与验证强度，不直接放行或拒绝。"
    source_ids: ["LAW-ANTI-FRAUD-2022", "REG-AML-CDD-2025-11"]
  - id: "user_confirmation"
    label: "用户确认"
    type: "record"
    definition: "用户对某次高风险操作的结构化同意记录，一次性使用，不可由聊天话术代替。"
    source_ids: ["CONTEST-REQ-2026", "LAW-PIPL-2021"]
  - id: "authorization_record"
    label: "授权记录"
    type: "record"
    definition: "能力令牌的签发与校验留痕，绑定参数哈希与一次性 nonce；它证明授权，不证明用户意图。"
    source_ids: ["CONTEST-REQ-2026", "CONTEST-POLICY-RULES-PY"]
  - id: "audit_event"
    label: "审计事件"
    type: "event"
    definition: "写入哈希审计链的事件，只增不改；金额、知识条目 id 与来源 id 都要能回指。"
    source_ids: ["CONTEST-REQ-2026", "LAW-PIPL-2021", "LAW-DSL-2021"]
  - id: "knowledge_entry"
    label: "知识条目"
    type: "knowledge"
    definition: "本知识层的一条术语、实体、意图规则或工作流；检索时以 id 回指，写进审计。"
    source_ids: ["CONTEST-REQ-2026"]

relations:
  # ---- 用户 / 账户 / 卡 ----
  - id: "rel_user_owns_account"
    label: "用户拥有账户"
    kind: "owns"
    domain: "user"
    range: "account"
    check: "账户必须归属唯一用户；跨用户访问账户一律拒绝，不因对话上下文放宽。"
    source_ids: ["BANK-ICBC-ACCT-AGREEMENT-2021"]
  - id: "rel_card_belongs_to_account"
    label: "卡片归属账户"
    kind: "belongs_to"
    domain: "card"
    range: "account"
    check: "卡片操作必须落在本人名下账户的卡片上；卡号尾号只是定位线索，不是授权凭据。"
    source_ids: ["BANK-ICBC-EB-RULES-2025"]
  - id: "rel_account_has_transaction"
    label: "账户产生交易流水"
    kind: "contains"
    domain: "account"
    range: "transaction"
    check: "余额只能由交易流水推导；不允许出现无流水支撑的余额变动。"
    source_ids: ["CONTEST-POLICY-RULES-PY"]

  # ---- 转账 ----
  - id: "rel_user_manages_payee"
    label: "用户维护收款人"
    kind: "manages"
    domain: "user"
    range: "payee"
    check: "新收款人只能由本人维护；聊天里出现的姓名与卡号不能直接成为收款人。"
    source_ids: ["BANK-ICBC-ALIAS-REMIT", "LAW-ANTI-FRAUD-2022"]
  - id: "rel_transfer_debits_account"
    label: "转账从账户出账"
    kind: "debits"
    domain: "transfer_order"
    range: "account"
    check: "出账账户必须是本人账户，且预授权冻结金额不超过可用余额。"
    source_ids: ["CONTEST-POLICY-RULES-PY"]
  - id: "rel_transfer_targets_payee"
    label: "转账指向收款人"
    kind: "targets"
    domain: "transfer_order"
    range: "payee"
    check: "收款人必须解析为唯一对象；零候选或多候选时必须追问，不能建单。"
    source_ids: ["BANK-ICBC-ALIAS-REMIT"]
  - id: "rel_transaction_records_transfer"
    label: "流水记录转账"
    kind: "records"
    domain: "transaction"
    range: "transfer_order"
    check: "一笔转账最多对应一条成功流水；重复提交不得产生第二条扣款流水。"
    source_ids: ["CONTEST-POLICY-RULES-PY"]
  - id: "rel_scheduled_executes_transfer"
    label: "预约到期生成转账"
    kind: "executes"
    domain: "scheduled_order"
    range: "transfer_order"
    check: "预约创建期不生成转账与扣款；执行日再按当日累计额度原子核额。"
    source_ids: ["CONTEST-POLICY-RULES-PY", "CONTEST-REQ-2026"]
  - id: "rel_split_creates_transfer"
    label: "拆账生成多笔转账"
    kind: "creates"
    domain: "split_bill_request"
    range: "transfer_order"
    check: "拆出的每笔转账都要单独确认，合计金额不得超过实付金额。"
    source_ids: ["CONTEST-REQ-2026"]
  - id: "rel_reversal_reverses_transfer"
    label: "冲正反向记账转账"
    kind: "reverses"
    domain: "reversal_record"
    range: "transfer_order"
    check: "只能冲正本人账户 7 天内的出账，且一笔原交易只能冲正一次。"
    source_ids: ["CONTEST-POLICY-RULES-PY", "GAP-TRANSFER-RETURN-CN"]
  - id: "rel_limit_governs_transfer"
    label: "限额约束转账"
    kind: "governs"
    domain: "limit_policy"
    range: "transfer_order"
    check: "单笔与日累计同时校验；日累计池包含已持有的预授权金额。"
    source_ids: ["CONTEST-POLICY-RULES-PY", "BANK-ICBC-EB-RULES-2025"]

  # ---- 理财 ----
  - id: "rel_purchase_buys_fund"
    label: "申购买入产品"
    kind: "references"
    domain: "purchase_order"
    range: "fund_product"
    check: "产品必须存在且在售；风险等级不得高于客户风险承受能力。"
    source_ids: ["REG-SUITABILITY-2025-07", "BANK-ABC-PS-2016"]
  - id: "rel_redeem_sells_fund"
    label: "赎回卖出产品"
    kind: "references"
    domain: "redeem_order"
    range: "fund_product"
    check: "赎回份额不得超过持仓；开放时段外转为预约。"
    source_ids: ["BANK-ABC-PS-2016"]
  - id: "rel_purchase_debits_account"
    label: "申购从账户扣款"
    kind: "debits"
    domain: "purchase_order"
    range: "account"
    check: "扣款账户必须是本人账户，且金额不超过可用余额。"
    source_ids: ["CONTEST-POLICY-RULES-PY"]
  - id: "rel_redeem_credits_account"
    label: "赎回到账账户"
    kind: "credits"
    domain: "redeem_order"
    range: "account"
    check: "赎回资金只能回到本人同名账户，且到账前不得用于转账。"
    source_ids: ["BANK-ABC-PS-2016", "BANK-ABC-EWEALTH-PRODUCT-PAGE"]
  - id: "rel_assessment_matches_fund"
    label: "风险测评匹配产品"
    kind: "matches"
    domain: "risk_assessment"
    range: "fund_product"
    check: "测评过期或产品风险高于客户承受能力时，禁止销售，只能提示或推荐更低风险产品。"
    source_ids: ["REG-SUITABILITY-2025-07"]

  # ---- 代扣 ----
  - id: "rel_mandate_binds_account"
    label: "代扣协议绑定账户"
    kind: "binds"
    domain: "mandate"
    range: "account"
    check: "协议只能绑定本人账户；签约需显式阅读确认并填写协议编号。"
    source_ids: ["BANK-ICBC-MANDATE-SIGN"]
  - id: "rel_mandate_authorizes_service"
    label: "代扣协议授权订阅服务"
    kind: "authorizes"
    domain: "mandate"
    range: "subscription_service"
    check: "银行侧解约只停止银行扣款，不取消商户侧订阅服务。"
    source_ids: ["BANK-ICBC-MANDATE-CANCEL", "BANK-CCB-CHARGE"]

  # ---- 卡片挂失 ----
  - id: "rel_loss_report_reports_card"
    label: "挂失记录申报卡片"
    kind: "reports"
    domain: "card_loss_report"
    range: "card"
    check: "挂失不可逆；必须强验证并落审计，补卡不得在同一操作里自动完成。"
    source_ids: ["CONTEST-REQ-2026", "BANK-ICBC-EB-RULES-2025"]

  # ---- 主动财务 ----
  - id: "rel_signal_flags_transfer"
    label: "风险信号标记转账"
    kind: "flags"
    domain: "risk_signal"
    range: "transfer_order"
    check: "风险信号只提高验证强度或触发提示，不能单独作为放行依据。"
    source_ids: ["LAW-ANTI-FRAUD-2022", "REG-AML-CDD-2025-11"]
  - id: "rel_confirmation_confirms_transfer"
    label: "用户确认确认转账"
    kind: "confirms"
    domain: "user_confirmation"
    range: "transfer_order"
    check: "一次确认只对一笔参数完全一致的转账有效；参数变化必须重新确认。"
    source_ids: ["CONTEST-REQ-2026", "CONTEST-POLICY-RULES-PY"]
  - id: "rel_audit_logs_confirmation"
    label: "审计记录确认"
    kind: "logs"
    domain: "audit_event"
    range: "user_confirmation"
    check: "每次确认与实际执行都必须落审计；审计链只增不改。"
    source_ids: ["CONTEST-REQ-2026", "LAW-PIPL-2021"]
