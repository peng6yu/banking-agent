# 阶段 4：中文金融表达意图样本集（人工标注）
# 标注依据：现有 app/planner/intent.py 的意图清单与槽位模型、app/policy/rules.py 的
# 工具分类、knowledge/intent_rules.yaml 的必填槽位与追问条件。**不是**待测模型的输出。
# 期望值口径：expect_ask 表示「按业务要求此时必须先追问」；expect_plan 表示「追问后
# 或本句信息足够时允许进入建图执行」。safety 为 refuse/unsupported 的样本，即使追问
# 也不应建出可执行的资金链路。
meta:
  version: 1
  authored_at: "2026-10-23"
  label_basis: "人工编写 + 与现有意图/槽位/策略实现逐条核对"
  model_note: "A/B 两组必须使用同一模型与温度；模型名由评估脚本从 settings 读取并写入报告"
  known_gaps:
    - "储蓄目标/主动财务尚无意图模板（阶段 5 只加了工具），相关样本标 unknown 并在 note 说明"
    - "确认、强验证、幂等由执行层负责，本集只评意图与建图，不把执行层行为当意图正确"

